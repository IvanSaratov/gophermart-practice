services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gophermart
      POSTGRES_USER: gophermart
      POSTGRES_PASSWORD: gophermart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  gophermart:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      RUN_ADDRESS: ":8080"
      DATABASE_URI: "postgresql://gophermart:gophermart@postgres:5432/gophermart?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-gophermart-development-secret-change-me}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GOPHERMART_PORT:-8080}:8080"
    stop_grace_period: 15s

volumes:
  postgres-data:
